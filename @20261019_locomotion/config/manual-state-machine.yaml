# Manual fallback state machine for 2026 team race.
# Runtime policy: operator selects a state; no judge/ground-truth input in the loop.
version: 1
default_state: flat
transition: manual
judge_in_loop: false
states:
  flat:
    purpose: default locomotion on flat ground
    policy: flat_ft_2500
    runtime_policy: flat_ft  # quadruped_control policy_switch name
    max_vx: 1.5
    max_vy: 0.5
    max_wz: 0.8
  loose:
    purpose: gravel / wood-debris pit; distinct success semantics from flat
    policy: flat_ft_2500   # temporary shared policy; split when loose specialist exists
    runtime_policy: loose_ft  # quadruped_control policy_switch name
    max_vx: 0.6
    max_vy: 0.3
    max_wz: 0.4
  limit_bar:
    purpose: pass under height bar without touching it
    policy: flat_ft_2500   # temporary; low-posture specialist later
    runtime_policy: limit_bar_ft  # quadruped_control policy_switch name
    max_vx: 0.5
    max_vy: 0.2
    max_wz: 0.3
    posture: low
  bridge:
    purpose: wood bridge A/B; narrow landing
    policy: flat_ft_2500   # temporary; bridge specialist later
    runtime_policy: bridge_ft  # quadruped_control policy_switch name
    max_vx: 0.4
    max_vy: 0.15
    max_wz: 0.25
    variants:
      blocks: "5 x 0.4 x 1.0 m square blocks, 0.15 m gaps"
      bands: "3 x 0.2 x 1.5 m narrow bands, 0.10 m gaps; hardest"
  stairs:
    purpose: T stairs / capability stairs
    policy: flat_ft_2500   # temporary; stairs specialist later
    runtime_policy: stairs_ft  # quadruped_control policy_switch name
    max_vx: 0.5
    max_vy: 0.2
    max_wz: 0.3
  high_wall:
    purpose: high wall climb/jump
    policy: flat_ft_2500   # temporary; climb specialist later
    runtime_policy: high_wall_ft  # quadruped_control policy_switch name
    max_vx: 0.4
    max_vy: 0.2
    max_wz: 0.2
  slope:
    purpose: race slope / capability slope
    policy: flat_ft_2500
    runtime_policy: slope_ft  # quadruped_control policy_switch name
    max_vx: 0.8
    max_vy: 0.3
    max_wz: 0.4
  slalom:
    purpose: straight-angle slalom (Part 1)
    policy: flat_ft_2500
    runtime_policy: slalom_ft  # quadruped_control policy_switch name
    max_vx: 0.8
    max_vy: 0.3
    max_wz: 0.8
