          40.0, 40.0, 40.0,
          40.0, 40.0, 40.0,
          40.0, 40.0, 40.0]
  rl_kd: [1.2, 1.2, 1.2,
          1.2, 1.2, 1.2,
          1.2, 1.2, 1.2,
          1.2, 1.2, 1.2]
  action_scale: [0.25, 0.25, 0.25,
                 0.25, 0.25, 0.25,
                 0.25, 0.25, 0.25,
                 0.25, 0.25, 0.25]
  lin_vel_scale: 2.0
  ang_vel_scale: 0.25
  dof_pos_scale: 1.0
  dof_vel_scale: 0.05
  commands_scale: [2.0, 2.0, 0.25]
  torque_limits: [33.5, 33.5, 33.5,
                  33.5, 33.5, 33.5,
                  33.5, 33.5, 33.5,
                  33.5, 33.5, 33.5]
  default_dof_pos: [0.0, 0.8014, -1.527, -0.0, -0.8014, 1.527, 0.0, 0.8014, -1.527, -0.0, -0.8014, 1.527]
