# 12 维数组都是**策略顺序** FL / FR / RL / RR × hip / thigh / calf。

black/himloco:
  # ---- 大作业未给、ReadYamlRL() 必读的字段 ----
  model_name: "best.pt"
  clip_obs: 100.0
  clip_actions_lower: [-100.0, -100.0, -100.0,
                       -100.0, -100.0, -100.0,
                       -100.0, -100.0, -100.0,
                       -100.0, -100.0, -100.0]
  clip_actions_upper: [100.0, 100.0, 100.0,
                       100.0, 100.0, 100.0,
                       100.0, 100.0, 100.0,
                       100.0, 100.0, 100.0]
  num_of_dofs: 12
  wheel_indices: []
  fixed_kp: [80.0, 80.0, 80.0,
             80.0, 80.0, 80.0,
             80.0, 80.0, 80.0,
             80.0, 80.0, 80.0]
  fixed_kd: [3.0, 3.0, 3.0,
             3.0, 3.0, 3.0,
             3.0, 3.0, 3.0,
             3.0, 3.0, 3.0]
  # 与 base.yaml 同一张表（ReadYamlRL 会覆盖 base 里读到的那份，所以两处必须一致）。
  joint_mapping: [0, 1, 2, 3, 4, 5, 9, 10, 11, 6, 7, 8]

  # ---- 以下照抄大作业 config.yaml ----
  num_observations: 45
  observations: ["commands","ang_vel", "gravity_vec", "dof_pos", "dof_vel", "actions"]
  observations_history: [0,1,2,3,4,5]  # 0 is the latest observation
