# Modified for @20261007_assignment: written for our robot "black" after upstream
# policy/go2/base.yaml (rl_sar e5c2f41). Field-by-field sources: docs/porting.md §3.

# Robot-level parameters read by the FSM (passive damping / get up / get down). The RL path reads
# himloco/config.yaml instead. Every 12-element array is in POLICY order: FL / FR / RL / RR x
# hip / thigh / calf (see joint_names).

black:
  # Not in the assignment config; values taken from the organiser fork's policy/black/base.yaml.
  # S4: control and inference are paced by the feedback's sim_time, so `dt` is the CONTROL period
  # (5 ms of sim time) and `decimation` is how many control cycles make one policy step: 4 x 5 = 20 ms,
  # the value HIMLoco was trained with. Both must keep that product.
  dt: 0.005
  decimation: 4
  # PD gains for get up / get down: same as the organiser fork and as the previous controller.
  fixed_kp: [80.0, 80.0, 80.0,
             80.0, 80.0, 80.0,
             80.0, 80.0, 80.0,
             80.0, 80.0, 80.0]
  fixed_kd: [3.0, 3.0, 3.0,
             3.0, 3.0, 3.0,
             3.0, 3.0, 3.0,
             3.0, 3.0, 3.0]
  num_of_dofs: 12
  wheel_indices: []
  # The four keys below do not exist upstream (they were hard-coded in policy/black/fsm.hpp); they live
  # here so tuning the get-up timing or the passive damping needs no recompile. Read once at
  # construction - restart the node to apply.
  kd_passive: 8.0          # kd in the passive state (kp = 0), as in upstream's README
  getup_pre_cycles: 200    # control cycles for the pre-get-up crouch ramp (5 ms each -> 1.0 s)
  getup_cycles: 400        # control cycles for the get-up ramp (5 ms each -> 2.0 s)
  getdown_cycles: 500      # control cycles for the get-down ramp (5 ms each -> 2.5 s)
  torque_limits: [33.5, 33.5, 33.5,
                  33.5, 33.5, 33.5,
                  33.5, 33.5, 33.5,
                  33.5, 33.5, 33.5]
  # Stance = default_dof_pos of the assignment config: the get-up target and the zero of RL actions.
  default_dof_pos: [0.0, 0.8014, -1.527,
                    -0.0, -0.8014, 1.527,
                    0.0, 0.8014, -1.527,
                    -0.0, -0.8014, 1.527]
  joint_names: [FL_hip_joint, FL_thigh_joint, FL_calf_joint,
                FR_hip_joint, FR_thigh_joint, FR_calf_joint,
                RL_hip_joint, RL_thigh_joint, RL_calf_joint,
                RR_hip_joint, RR_thigh_joint, RR_calf_joint]
  # Only used by ROS 1 / Gazebo, but ReadYamlBase() reads it unconditionally, so keep it (upstream name).
  joint_controller_names: [FL_hip_controller, FL_thigh_controller, FL_calf_controller,
                           FR_hip_controller, FR_thigh_controller, FR_calf_controller,
                           RL_hip_controller, RL_thigh_controller, RL_calf_controller,
                           RR_hip_controller, RR_thigh_controller, RR_calf_controller]
  # joint_mapping[policy index] = index in the sim message. The sim (@20261005_ros2 actuator order) is
  # FL / FR / RR / RL while the policy is FL / FR / RL / RR: the first two legs match, the last two swap.
  joint_mapping: [0, 1, 2, 3, 4, 5, 9, 10, 11, 6, 7, 8]
